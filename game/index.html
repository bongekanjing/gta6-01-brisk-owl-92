<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Verano</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1016; }
  #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; pointer-events: none; }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 42%, rgba(12,20,30,0.34), rgba(6,10,16,0.86));
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #f4f1ea;
    transition: opacity 160ms ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .card { text-align: center; padding: 0 24px; max-width: 760px; }
  .card h1 {
    margin: 0; font-size: 82px; letter-spacing: 10px; font-weight: 800;
    text-transform: uppercase; line-height: 1;
    background: linear-gradient(180deg, #ffe9b0, #ff9068 62%, #e0466f);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 6px 40px rgba(255,140,90,0.28);
  }
  .card .tag {
    margin: 14px 0 26px; font-size: 17px; letter-spacing: 5px; text-transform: uppercase;
    color: rgba(244,241,234,0.62); font-weight: 600;
  }
  .card .keys { margin: 0 0 22px; font-size: 14px; line-height: 2; color: rgba(244,241,234,0.8); }
  .card .keys b { color: #ffd166; font-weight: 700; }
  .card .go { margin: 0; font-size: 16px; color: rgba(244,241,234,0.72); }
  .card .go b { color: #8ef0a8; }
</style>
</head>
<body>
<canvas id="view" aria-label="Vice Verano: an open-world crime game. Walk and drive a sunlit city, steal cars, take missions and outrun the police."></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<div id="overlay"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
